events {}

http {
    server {
        listen 80;

        # Location 1: Serve the frontend player
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # Location 2: Proxy requests to the stream-api
        # This is the trigger to start the ffmpeg process
        location /play/ {
            proxy_pass http://stream-api:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Location 3: Proxy heartbeat requests to the stream-api
        location /heartbeat/ {
            proxy_pass http://stream-api:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Location 4: Serve the HLS stream files directly from the shared volume
        # These are generated by ffmpeg
        location /hls/ {
            root /mnt/media/streams;
            add_header Cache-Control 'no-cache';

            # CORS headers to allow playback on different domains
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length';

            # HLS mime types
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }
    }
}
