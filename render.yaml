services:
  # Frontend - Static Site
  - type: web
    name: frontend
    env: static
    buildCommand: ""
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Admin UI - Web Service
  - type: web
    name: admin-ui
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r admin_ui/requirements.txt
    startCommand: python admin_ui/app.py
    healthCheckPath: /health
    envVars:
      - key: SERVICE_NAME
        value: admin-ui
      - key: SERVICE_VERSION
        value: "1.0.0"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_MODE
        value: hybrid
      - key: STAGING_DIR
        value: /tmp/staging
      - key: NORMALIZED_DIR
        value: /tmp/normalized
      - key: STREAMS_DIR
        value: /tmp/streams
      # Database (CockroachDB Cloud) - Configure in Render Dashboard
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "26257"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Storage (Cloudflare R2) - Configure in Render Dashboard
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      # APIs - Configure in Render Dashboard
      - key: TMDB_API_KEY
        sync: false

