<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduling Rules</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Scheduling Rules</h1>
        <p>This is a placeholder for the scheduling rules management interface. The form to add and edit rules will be implemented here.</p>

        <h2>Existing Rules</h2>
        <table>
            <thead>
                <tr>
                    <th>Channel Name</th>
                    <th>Active</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for rule in rules %}
                <tr>
                    <td>{{ rule.channel_name }}</td>
                    <td>{{ 'Yes' if rule.is_active else 'No' }}</td>
                    <td><a href="#">Edit</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
