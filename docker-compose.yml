version: '3.8'

services:
  # --- Infrastructure Services ---
  rabbitmq:
    image: rabbitmq:3.11-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure
    hostname: db
    ports:
      - "26257:26257"
      - "8081:8080"
    volumes:
      - db_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Database Initializer ---
  db-init:
    image: cockroachdb/cockroach:latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database_schema_cockroach.sql:/schema.sql
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "echo 'Waiting for DB to be ready...' &&
       sleep 5 &&
       /cockroach/cockroach sql --insecure --host=db -e 'CREATE DATABASE IF NOT EXISTS media_server;' &&
       /cockroach/cockroach sql --insecure --host=db --database=media_server -f /schema.sql &&
       echo 'Database initialized.'"

  # --- Application Services ---
  media_manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: media_manager
        REQUIREMENTS_FILE: media_manager/requirements.txt
    command: python media_manager.py
    environment: &app-env
      DB_HOST: db
      DB_PORT: '26257'
      DB_NAME: media_server
      DB_USER: root
      DB_PASSWORD: ''
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: user
      RABBITMQ_PASS: password
      STAGING_DIR: /mnt/media/staging_ingest
      SERVICE_NAME: media_manager
      SERVICE_VERSION: "1.0.0"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      ENVIRONMENT: production
    volumes:
      - media_volume:/mnt/media
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.append('/app'); from shared.health_check import check_database_connection, check_rabbitmq_connection; exit(0 if check_database_connection() and check_rabbitmq_connection() else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  metadata_enricher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: metadata_enricher
        REQUIREMENTS_FILE: metadata_enricher/requirements.txt
    command: python metadata_enricher.py
    environment:
      <<: *app-env
      SERVICE_NAME: metadata_enricher
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.append('/app'); from shared.health_check import check_database_connection, check_rabbitmq_connection; exit(0 if check_database_connection() and check_rabbitmq_connection() else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  normalization_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: normalization_worker
        REQUIREMENTS_FILE: normalization_worker/requirements.txt
    command: python normalization_worker.py
    environment: *app-env
    volumes:
      - media_volume:/mnt/media
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  scene_analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: scene_analyzer
        REQUIREMENTS_FILE: scene_analyzer/requirements.txt
    command: python scene_analyzer.py
    environment: *app-env
    volumes:
      - media_volume:/mnt/media
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  admin_ui:
    build:
      context: .
      dockerfile: admin_ui/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - media_volume:/mnt/media/staging_ingest
    environment:
      <<: *app-env
      SERVICE_NAME: admin_ui
      SERVICE_VERSION: "1.0.0"
      STAGING_DIR: /mnt/media/staging_ingest
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      ENVIRONMENT: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  scheduler_ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: scheduler_ai
        REQUIREMENTS_FILE: scheduler_ai/requirements.txt
    command: python scheduler.py
    environment: *app-env
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  stream-api:
    build:
      context: .
      dockerfile: stream_api/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - media_volume:/mnt/media
    environment: *app-env
    depends_on:
      db-init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.21
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - media_volume:/mnt/media/streams:ro
    depends_on:
      - stream-api
      - admin_ui

volumes:
  rabbitmq_data:
  db_data:
  media_volume:
