version: '3.8'

services:
  # --- Infrastructure Services (Removed - Using External Services) ---
  # Local CockroachDB and RabbitMQ removed - using CockroachDB Cloud and CloudAMQP

  # --- Application Services (Converted to Web Services) ---
  media_manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: media_manager
        REQUIREMENTS_FILE: media_manager/requirements.txt
    command: python media_manager/app.py
    ports:
      - "8002:5000"
    environment: &app-env
      # External Database (CockroachDB Cloud)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-26257}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # External Message Queue (CloudAMQP)
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      # External Storage (Cloudflare R2)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      STORAGE_MODE: ${STORAGE_MODE:-hybrid}
      # External APIs
      TMDB_API_KEY: ${TMDB_API_KEY}
      # Service Configuration
      STAGING_DIR: /mnt/media/staging_ingest
      SERVICE_NAME: media_manager
      SERVICE_VERSION: "1.0.0"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      ENVIRONMENT: development
    volumes:
      - media_volume:/mnt/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  metadata_enricher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: metadata_enricher
        REQUIREMENTS_FILE: metadata_enricher/requirements.txt
    command: python metadata_enricher/app.py
    ports:
      - "8003:5000"
    environment:
      <<: *app-env
      SERVICE_NAME: metadata_enricher
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  normalization_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: normalization_worker
        REQUIREMENTS_FILE: normalization_worker/requirements.txt
    command: python normalization_worker/app.py
    ports:
      - "8004:5000"
    environment:
      <<: *app-env
      SERVICE_NAME: normalization_worker
    volumes:
      - media_volume:/mnt/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  scene_analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: scene_analyzer
        REQUIREMENTS_FILE: scene_analyzer/requirements.txt
    command: python scene_analyzer/app.py
    ports:
      - "8005:5000"
    environment:
      <<: *app-env
      SERVICE_NAME: scene_analyzer
    volumes:
      - media_volume:/mnt/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  admin_ui:
    build:
      context: .
      dockerfile: admin_ui/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - media_volume:/mnt/media/staging_ingest
    environment:
      <<: *app-env
      SERVICE_NAME: admin_ui
      SERVICE_VERSION: "1.0.0"
      STAGING_DIR: /mnt/media/staging_ingest
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      ENVIRONMENT: development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  scheduler_ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: scheduler_ai
        REQUIREMENTS_FILE: scheduler_ai/requirements.txt
    command: python scheduler_ai/app.py
    ports:
      - "8006:5000"
    environment:
      <<: *app-env
      SERVICE_NAME: scheduler_ai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  stream-api:
    build:
      context: .
      dockerfile: stream_api/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - media_volume:/mnt/media
    environment:
      <<: *app-env
      SERVICE_NAME: stream-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  nginx:
    image: nginx:1.21
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - media_volume:/mnt/media/streams:ro
    depends_on:
      - stream-api
      - admin_ui

volumes:
  media_volume:
